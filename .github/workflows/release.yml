name: Release

# Every push to main that touches the app builds the Windows installer and publishes it as the
# latest release. The landing page links to releases/latest/download/Vozella-Setup.exe, so that
# link always serves the newest build. Run it by hand from the Actions tab to publish without a push.
on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "native/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that has not finished.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Full history and tags, to compute the version and list what changed since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Uses the version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      # The typecheck and the tests read the addon's generated files.
      - run: pnpm build:native

      - run: pnpm check

      # The version follows the Conventional Commits since the last v* tag (scripts/next-version.mjs):
      # feat bumps the minor, a breaking change the minor while at 0.x, anything else the patch.
      # It is written into package.json for this build only; the release step tags it.
      - name: Set the build version
        shell: pwsh
        run: |
          $file = "apps/desktop/package.json"
          $version = "$(node scripts/next-version.mjs)".Trim()
          if (-not $version) {
            Write-Error "scripts/next-version.mjs printed no version"
            exit 1
          }
          # No commits since the last tag (a manual run) gives that tag's version back.
          if (git tag --list "v$version") {
            Write-Error "v$version is already released; nothing new to publish"
            exit 1
          }
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('$file','utf8'));m.version='$version';fs.writeFileSync('$file',JSON.stringify(m,null,2)+'\n')"
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: pnpm package

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = "apps/desktop/release/Vozella-Setup-$env:VERSION.exe"
          # Installed copies update from these: latest.yml names the versioned installer, and the
          # blockmap lets electron-updater download only the changed blocks.
          $blockmap = "$source.blockmap"
          $feed = "apps/desktop/release/latest.yml"
          foreach ($file in @($source, $blockmap, $feed)) {
            if (-not (Test-Path $file)) {
              Write-Error "Release file not found: $file"
              exit 1
            }
          }
          # The asset names must be the names latest.yml points at, or the update download 404s.
          $expected = "Vozella-Setup-$env:VERSION.exe"
          if (-not (Select-String -Path $feed -SimpleMatch "path: $expected" -Quiet)) {
            Write-Error "latest.yml does not name $expected"
            exit 1
          }
          # The name stays the same across versions, so the landing page link never changes.
          $installer = "apps/desktop/release/Vozella-Setup.exe"
          Copy-Item $source $installer
          "$((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower())  Vozella-Setup.exe" |
            Set-Content "$installer.sha256" -Encoding ascii
          # The notes list feat and fix commits since the previous tag, in plain words.
          $previous = git tag --list "v*" --sort=-creatordate | Select-Object -First 1
          $pattern = "^(feat|fix)(\([^)]+\))?!?: "
          $subjects = git log "$previous..HEAD" --no-merges --format=%s | Where-Object { $_ -match $pattern }
          $changes = ($subjects | ForEach-Object { "- " + ($_ -replace $pattern, "") }) -join "`n"
          if (-not $previous) { $changes = "First public beta." }
          elseif (-not $changes) { $changes = "Maintenance and internal improvements." }
          $notes = (Get-Content .github/release-notes.md -Raw).Replace("{{VERSION}}", $env:VERSION).Replace("{{CHANGES}}", $changes)
          Set-Content release-notes.generated.md $notes -Encoding utf8
          gh release create "v$env:VERSION" $installer "$installer.sha256" $source $blockmap $feed `
            --target $env:GITHUB_SHA --latest --notes-file release-notes.generated.md --title "Vozella $env:VERSION"
